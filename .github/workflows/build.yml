name: Build and release GF2Recorder

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: gf2recorder-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set version
        shell: pwsh
        run: |
          "VERSION=v0.2.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: dotnet restore GF2Recorder.csproj

      - name: Build portable EXE
        shell: pwsh
        run: dotnet publish GF2Recorder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "bin/Release/net8.0-windows/win-x64/publish/GF2Recorder.exe" "release/GF2Recorder-${{ env.VERSION }}.exe"
          Get-FileHash "release/GF2Recorder-${{ env.VERSION }}.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  GF2Recorder-${{ env.VERSION }}.exe" } |
            Set-Content "release/GF2Recorder-${{ env.VERSION }}-SHA256.txt"
          Get-ChildItem release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GF2Recorder-${{ env.VERSION }}
          path: release/*
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: GF2Recorder ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/GF2Recorder-${{ env.VERSION }}.exe
            release/GF2Recorder-${{ env.VERSION }}-SHA256.txt
